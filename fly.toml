app = "joplin-flyio-terraform-deploy"
primary_region = "gru"

[build]
  dockerfile = "docker/Dockerfile"

[env]
  APP_PORT = "22300"
  NODE_ENV = "production"

[http_service]
  internal_port = 22300
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256